name: Build and Push to ECR

on:
  workflow_call:
    inputs:
      aws-account-id:
        description: "AWS 계정 ID"
        type: string
        required: true
      aws-region:
        description: "AWS 리전"
        type: string
        required: true
      ecr-repo-name:
        description: "ECR 저장소 이름 (기본: 호출 저장소 이름)"
        type: string
        default: ""
      builder-image:
        description: "CodeBuild 빌더 이미지 (예: arm-3.0, 3.0)"
        type: string
        default: "arm-3.0"
      instance-size:
        description: "CodeBuild 인스턴스 크기 (small, medium, large)"
        type: string
        default: "small"
      dockerfile-context:
        description: "Docker 빌드 컨텍스트 경로"
        type: string
        default: "."
      image-tag:
        description: "이미지 태그 (기본: git 태그명)"
        type: string
        default: ""
    secrets:
      # private 저장소의 의존(예: provider가 공표한 Go 계약 모듈 — ADR-0020)을 빌드 중에
      # 받아야 하는 호출자만 넘긴다. 넘기지 않으면 --secret 플래그 자체가 붙지 않으므로
      # 기존 호출자의 동작은 그대로다.
      private-deps-token:
        description: "private 저장소 read 토큰 — Dockerfile에 BuildKit secret 'private_deps_token'으로 전달된다"
        required: false

jobs:
  build:
    runs-on:
      - codebuild-homelab-app-builder-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ inputs.builder-image }}
        instance-size:${{ inputs.instance-size }}

    env:
      AWS_REGION: ${{ inputs.aws-region }}
      AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
      ECR_REPO_NAME: ${{ inputs.ecr-repo-name || github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.image-tag || github.ref_name }}
      # BuildKit secret은 파일로 마운트된다 — 빌드 인자와 달리 이미지 레이어·history에 남지 않는다
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${AWS_REGION} \
            | docker login --username AWS --password-stdin \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

      - name: Build and Push
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.private-deps-token }}
        run: |
          ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_NAME}"
          # 토큰을 넘긴 호출자에게만 --secret을 붙인다 — 빈 값으로 붙이면 BuildKit이 거부한다
          SECRET_ARGS=""
          if [ -n "${PRIVATE_DEPS_TOKEN}" ]; then
            SECRET_ARGS="--secret id=private_deps_token,env=PRIVATE_DEPS_TOKEN"
          fi
          docker build ${SECRET_ARGS} -t ${ECR_REPO}:${IMAGE_TAG} ${{ inputs.dockerfile-context }}
          docker push ${ECR_REPO}:${IMAGE_TAG}
